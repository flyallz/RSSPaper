name: Check and build both platforms

on:
  push:
    branches: [main]
    paths:
      - 'src/journal_radar/**'
      - 'src/universal/v1.1/**'
      - 'src/universal/macos-v1.1/**'
      - 'tests/**'
      - 'scripts/build-universal*'
      - 'pyproject.toml'
      - 'requirements-build.txt'
      - '.github/workflows/**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install shared build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check formatting and imports
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run shared regressions
        run: python -m unittest discover -s tests -v
      - name: Build and test the frozen application
        run: python scripts/build-universal.py --skip-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journal-radar-${{ matrix.os }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 14
