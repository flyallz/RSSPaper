name: Prepare a cross-platform release

on:
  workflow_dispatch:
    inputs:
      publish_draft:
        description: Create a draft GitHub release after both builds pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  draft:
    if: inputs.publish_draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: journal-radar-*
          merge-multiple: true
          path: artifacts
      - name: Create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(PYTHONPATH=src python -c 'from journal_radar.config import VERSION; print(VERSION)')
          gh release create "v$VERSION" artifacts/*.zip artifacts/SHA256SUMS-*.txt --draft --title "期刊雷达 · v$VERSION" --notes-file docs/版本说明-v1.4.0.md --target "$GITHUB_SHA"
