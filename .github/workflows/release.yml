name: Package Windows versions

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-v1.1]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r src/universal/v1.1/requirements.txt
      - name: Test and build universal versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($version in @('v1.0', 'v1.1')) {
            Push-Location "src/universal/$version"
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dist = Join-Path $env:RUNNER_TEMP "dist-$version"
            python -m PyInstaller --noconfirm --clean --distpath $dist JournalRadar.spec
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $test = Start-Process -FilePath (Join-Path $dist 'JournalRadar/JournalRadar.exe') -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
            if ($test.ExitCode -ne 0) { exit $test.ExitCode }
            Copy-Item README.txt (Join-Path $dist 'JournalRadar/README.txt')
            Pop-Location
            New-Item -ItemType Directory -Path artifacts -Force | Out-Null
            Compress-Archive -LiteralPath (Join-Path $dist 'JournalRadar') -DestinationPath "artifacts/JournalRadar-Universal-$version-Portable.zip" -Force
          }
      - name: Package legacy versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($version in @('v1.2', 'v1.3', 'v1.4', 'v1.5')) {
            $folder = Join-Path $env:RUNNER_TEMP "EdTechRadar-Windows-$version"
            Copy-Item "src/legacy/$version" $folder -Recurse
            Compress-Archive -LiteralPath $folder -DestinationPath "artifacts/EdTechRadar-Windows-$version.zip" -Force
          }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem artifacts/*.zip | ForEach-Object { $_.FullName })
          gh release create v1.1 $assets --title '期刊雷达 Windows 版本合集 · v1.1' --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA
