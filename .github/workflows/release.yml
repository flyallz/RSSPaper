name: Package Windows v1.3

on:
  push:
    branches: [main]
    paths:
      - 'src/universal/v1.1/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-windows-v1.3]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r src/universal/v1.1/requirements.txt
      - name: Test and build Windows universal version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location "src/universal/v1.1"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dist = Join-Path $env:RUNNER_TEMP "dist-v1.3"
          python -m PyInstaller --noconfirm --clean --distpath $dist JournalRadar.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process -FilePath (Join-Path $dist 'JournalRadar/JournalRadar.exe') -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
          Copy-Item README.txt (Join-Path $dist 'JournalRadar/README.txt')
          Pop-Location
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -LiteralPath (Join-Path $dist 'JournalRadar') -DestinationPath "artifacts/JournalRadar-Universal-v1.3-Windows-Portable.zip" -Force
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem artifacts/*.zip | ForEach-Object { $_.FullName })
          gh release create v1.3-windows $assets --title '期刊雷达 Windows 通用版 · v1.3' --notes-file RELEASE_NOTES_V1.3.md --target $env:GITHUB_SHA
